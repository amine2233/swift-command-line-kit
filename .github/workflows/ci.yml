name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: amine2233/ci-shared/.github/workflows/ci.yml@1.1
    with:
      enable-macos: true
      enable-linux: true
      enable-lint: true
      enable-coverage: false
      enable-title-check: true

  test-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.1"
      - run: ./test.sh
